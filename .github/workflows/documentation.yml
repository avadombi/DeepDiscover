name: DeepDiscover documentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/generate_api.py'
      - 'tools/check_publication.py'
      - 'src/deepdiscover/**'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/generate_api.py'
      - 'tools/check_publication.py'
      - 'src/deepdiscover/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepdiscover-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation tools
        run: python -m pip install -r docs/requirements.txt
      - name: Build API reference
        run: python tools/generate_api.py
      - name: Verify figures and links
        run: python tools/check_publication.py
      - name: Build HTML
        run: python -m sphinx -b html -n -W --keep-going docs _build/html
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
