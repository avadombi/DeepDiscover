name: Bug report
description: Report a reproducible problem in DeepDiscover
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Include a small example. Do not share private data or credentials."
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Provide code and input shapes.
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Python, TensorFlow, Keras and DeepDiscover versions.
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Error message
      render: text
